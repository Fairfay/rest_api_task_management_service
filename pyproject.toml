[project]
name = "rest-api-task-management-service"
version = "1.0.0"
description = "A small REST service for managing payout requests. Each request is created via the API and processed asynchronously using Celery."
authors = [
    {name = "Fairfay",email = "dencat87@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (>=4.2,<7.0)",
    "nplusone (>=1.0.0,<2.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "drf-standardized-errors (>=0.15.0,<0.16.0)",
    "django-debug-toolbar (>=6.1.0,<7.0.0)",
    "django-telegram-logging (>=1.0.2,<2.0.0)",
    "django-structlog (>=10.0.0,<11.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "psycopg (>=3.3.1,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "django-querycount (>=0.8.3,<0.9.0)",
    "django-query-counter (>=0.4.1,<0.5.0)",
    "whitenoise (>=6.11.0,<7.0.0)",
    "celery (>=5.3.0,<6.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "drf-spectacular (>=0.27.0,<1.0.0)",
    "django-health-check (>=3.20.0,<4.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-django (>=4.8.0,<5.0.0)",
    "pytest-cov (>=4.1.0,<5.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
